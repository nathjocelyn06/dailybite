<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile fridge</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Caveat:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EDEDEB}
a{color:#231F1C}
h1,h2,h3,p{margin:0}
.ph{background-color:#E2E2DF;background-image:linear-gradient(to top right,transparent calc(50% - 0.7px),#C9C9C6 50%,transparent calc(50% + 0.7px)),linear-gradient(to bottom right,transparent calc(50% - 0.7px),#C9C9C6 50%,transparent calc(50% + 0.7px))}
.ic{width:20px;height:20px;flex:none;border:1.5px solid currentColor;border-radius:6px;box-sizing:border-box}
.lbl{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#66615D}
.seg{all:unset;cursor:pointer;flex:1;min-height:38px;border-radius:9px;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #E4E4E1;font-size:13px}
.door{position:absolute;left:0;width:400px;transform-origin:left center;transition:transform .75s cubic-bezier(.3,.7,.3,1);backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.07),inset 0 -6px 0 rgba(0,0,0,.04)}
.deco{all:unset;position:absolute;box-sizing:border-box;cursor:grab;touch-action:none;user-select:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;box-shadow:0 2px 5px rgba(0,0,0,.14);outline-offset:3px}
.handle{all:unset;position:absolute;cursor:pointer;width:140px;height:22px;border-radius:11px;background:#E3E5E6;border:1px solid #A7AAAC;box-shadow:0 2px 3px rgba(0,0,0,.12)}
.shelf{display:flex;flex-direction:column;gap:4px;padding:6px 10px 8px;border-bottom:4px solid rgba(170,196,208,.55)}
.tile{all:unset;cursor:pointer;box-sizing:border-box;width:64px;padding:4px 3px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tool{all:unset;cursor:pointer;box-sizing:border-box;width:44px;height:44px;border-radius:12px;border:1px solid #D6D6D3;background:#FFFFFF;display:flex;align-items:center;justify-content:center;flex:none}
.mini{all:unset;cursor:pointer;box-sizing:border-box;min-height:40px;padding:0 12px;border-radius:10px;border:1px solid #C9C9C6;background:#FFFFFF;font-size:12px;font-weight:600;display:flex;align-items:center}
.tb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:#66615D;text-decoration:none;min-height:56px}
.tb .ti{width:56px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center}
.tb.on{color:#0F5C85;font-weight:700}
.tb.on .ti{background:#D9E9F5}
.mcrumb{display:inline-flex;align-items:center;gap:4px;min-height:32px;font-size:13px;color:#4A4542;text-decoration:none;align-self:flex-start}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #EDEDEB; font-family: Inter, system-ui, sans-serif; color: #231F1C; display: flex; flex-direction: column">
<div style="flex: 1; overflow-y: auto; padding: 16px 16px 88px; display: flex; flex-direction: column; gap: 10px">
<a href="M07-Kitchen.dc.html" class="mcrumb">‹ My Kitchen</a>
<div style="display: flex; justify-content: space-between; align-items: center"><h1 style="font-size: 20px; font-weight: 700">Digital fridge</h1><button type="button" onClick="{{toggleAll}}" style="all: unset; cursor: pointer; min-height: 40px; padding: 0 14px; border-radius: 12px; background: #F9D312; font-size: 13px; font-weight: 700">{{allLabel}}</button></div>
<div role="tablist" aria-label="Fridge sections" style="display: flex; gap: 4px; padding: 4px; background: #E2E2DF; border-radius: 12px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="2"><button type="button" role="tab" class="seg" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="background: {{t.bg}}">{{t.l}}</button></sc-for>
</div>

<sc-if value="{{isFridge}}" hint-placeholder-val="{{ true }}">
<div style="width: 300px; height: 510px; position: relative; align-self: center; flex: none">
<div data-fridge="1" onPointerMove="{{move}}" onPointerUp="{{up}}" onPointerCancel="{{up}}" style="position: absolute; left: 0; top: 0; width: 400px; height: 680px; transform: scale(.75); transform-origin: top left; perspective: 1800px; touch-action: none">

<div aria-hidden="{{insideHidden}}" style="position: absolute; inset: 0; border-radius: 44px 44px 26px 26px; background: {{color}}; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08)">
<div style="position: absolute; left: 14px; right: 14px; top: 14px; height: 166px; border-radius: 32px 32px 6px 6px; background: #F1F4F5; box-shadow: inset 0 8px 18px rgba(0,0,0,.08); padding: 14px 16px 8px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px">
<span class="lbl" style="text-align: center; font-size: 12px">Freezer</span>
<div style="display: flex; justify-content: center; gap: 8px">
<sc-for list="{{frozen}}" as="it" hint-placeholder-count="3"><button type="button" class="tile" onClick="{{it.pick}}" aria-label="{{it.aria}}" style="background: {{it.bg}}; outline: {{it.ring}}"><span class="ph" style="width: 44px; height: 40px; border-radius: 8px"></span><span style="font-size: 12px; font-weight: 600; white-space: nowrap">{{it.name}}</span><span style="font-size: 11px; color: {{it.fc}}">{{it.flag}}</span></button></sc-for>
</div>
</div>
<div style="position: absolute; left: 14px; right: 14px; top: 214px; height: 404px; border-radius: 8px; background: #F7F9F9; box-shadow: inset 0 10px 22px rgba(0,0,0,.07); display: flex; flex-direction: column; overflow: hidden">
<sc-for list="{{shelves}}" as="s" hint-placeholder-count="2">
<div class="shelf" style="flex: 1"><span class="lbl" style="font-size: 12px">{{s.name}}</span>
<div style="display: flex; gap: 6px">
<sc-for list="{{s.items}}" as="it" hint-placeholder-count="3"><button type="button" class="tile" onClick="{{it.pick}}" aria-label="{{it.aria}}" style="background: {{it.bg}}; outline: {{it.ring}}"><span class="ph" style="width: 44px; height: 40px; border-radius: 8px"></span><span style="font-size: 12px; font-weight: 600; white-space: nowrap">{{it.name}}</span><span style="font-size: 11px; color: {{it.fc}}">{{it.flag}}</span></button></sc-for>
</div></div>
</sc-for>
<div style="height: 150px; flex: none; padding: 6px 10px 10px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px">
<span class="lbl" style="font-size: 12px">Crisper · veg &amp; fruit</span>
<div style="flex: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{drawers}}" as="dr" hint-placeholder-count="2">
<div style="border-radius: 10px; background: rgba(214,228,234,.55); border: 1px solid rgba(150,175,186,.6); display: flex; justify-content: center; gap: 2px; padding: 4px">
<sc-for list="{{dr.items}}" as="it" hint-placeholder-count="2"><button type="button" class="tile" onClick="{{it.pick}}" aria-label="{{it.aria}}" style="width: 76px; background: {{it.bg}}; outline: {{it.ring}}"><span class="ph" style="width: 42px; height: 36px; border-radius: 8px"></span><span style="font-size: 12px; font-weight: 600; white-space: nowrap">{{it.name}}</span><span style="font-size: 11px; color: {{it.fc}}">{{it.flag}}</span></button></sc-for>
</div>
</sc-for>
</div>
</div>
</div>
<div style="position: absolute; left: 34px; right: 34px; bottom: 10px; height: 28px; border-radius: 6px; background: repeating-linear-gradient(180deg, transparent 0 5px, rgba(0,0,0,.08) 5px 7px)"></div>
</div>

<div class="door" style="top: 0; height: 190px; border-radius: 44px 44px 8px 8px; background: {{color}}; transform: {{topT}}; pointer-events: {{topPE}}; z-index: 3">
<sc-for list="{{topDecos}}" as="d" hint-placeholder-count="3">
<button type="button" class="deco" onPointerDown="{{d.down}}" aria-label="{{d.aria}}" style="left: {{d.x}}px; top: {{d.y}}px; width: {{d.w}}px; height: {{d.h}}px; transform: rotate({{d.rot}}deg); background: {{d.bg}}; border-radius: {{d.r}}; border: {{d.border}}; padding: {{d.pad}}; outline: {{d.ring}}">
<sc-if value="{{d.tape}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; top: -9px; left: 50%; width: 46px; height: 16px; margin-left: -23px; background: rgba(226,221,200,.92); transform: rotate(-3deg)"></span></sc-if>
<sc-for list="{{d.phs}}" as="p" hint-placeholder-count="1"><span class="ph" style="width: 100%; flex: 1; min-height: 0"></span></sc-for>
<sc-if value="{{d.cal}}" hint-placeholder-val="{{ false }}"><span style="width: 100%; height: 52px; flex: none; background: repeating-linear-gradient(90deg, transparent 0 14px, #DCDCD9 14px 15px), repeating-linear-gradient(180deg, transparent 0 9px, #DCDCD9 9px 10px)"></span></sc-if>
<span style="font-family: {{d.font}}; font-size: {{d.fs}}; font-weight: {{d.fw}}; color: #3A3A36; text-transform: {{d.tt}}; text-align: center; line-height: 1.05; white-space: pre-line">{{d.text}}</span>
</button>
</sc-for>
<button type="button" class="handle" onClick="{{toggleTop}}" aria-label="{{topAria}}" style="left: 36px; bottom: 20px"></button>
</div>

<div class="door" style="top: 200px; height: 432px; border-radius: 8px 8px 12px 12px; background: {{color}}; transform: {{botT}}; pointer-events: {{botPE}}; z-index: 3">
<button type="button" onClick="{{openAll}}" aria-label="Fridge status: open to see stock" style="all: unset; cursor: pointer; position: absolute; right: 18px; top: 18px; width: 100px; padding: 8px 6px; border-radius: 14px; background: #231F1C; color: #FFFFFF; text-align: center; font-size: 13px; line-height: 1.3; z-index: 1"><strong style="font-size: 20px; display: block">{{soonCount}}</strong>use soon<br>{{lowCount}} low</button>
<sc-for list="{{botDecos}}" as="d" hint-placeholder-count="4">
<button type="button" class="deco" onPointerDown="{{d.down}}" aria-label="{{d.aria}}" style="left: {{d.x}}px; top: {{d.y}}px; width: {{d.w}}px; height: {{d.h}}px; transform: rotate({{d.rot}}deg); background: {{d.bg}}; border-radius: {{d.r}}; border: {{d.border}}; padding: {{d.pad}}; outline: {{d.ring}}">
<sc-if value="{{d.tape}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; top: -9px; left: 50%; width: 46px; height: 16px; margin-left: -23px; background: rgba(226,221,200,.92); transform: rotate(-3deg)"></span></sc-if>
<sc-for list="{{d.phs}}" as="p" hint-placeholder-count="1"><span class="ph" style="width: 100%; flex: 1; min-height: 0"></span></sc-for>
<sc-if value="{{d.cal}}" hint-placeholder-val="{{ false }}"><span style="width: 100%; height: 52px; flex: none; background: repeating-linear-gradient(90deg, transparent 0 14px, #DCDCD9 14px 15px), repeating-linear-gradient(180deg, transparent 0 9px, #DCDCD9 9px 10px)"></span></sc-if>
<span style="font-family: {{d.font}}; font-size: {{d.fs}}; font-weight: {{d.fw}}; color: #3A3A36; text-transform: {{d.tt}}; text-align: center; line-height: 1.05; white-space: pre-line">{{d.text}}</span>
</button>
</sc-for>
<button type="button" class="handle" onClick="{{toggleBot}}" aria-label="{{botAria}}" style="left: 36px; top: 20px"></button>
</div>
</div>
</div>

<sc-if value="{{trayAdd}}" hint-placeholder-val="{{ true }}">
<div role="toolbar" aria-label="Decorate" style="display: flex; gap: 6px; width: 290px">
<sc-for list="{{kinds}}" as="k" hint-placeholder-count="5"><button type="button" class="tool" onClick="{{k.add}}" aria-label="{{k.aria}}"><span style="width: {{k.iw}}; height: {{k.ih}}; border-radius: {{k.ir}}; background: {{k.ibg}}; border: 1px solid #C9C9C6; box-sizing: border-box"></span></button></sc-for>
<button type="button" class="tool" onClick="{{cycleColor}}" aria-label="Change fridge colour"><span style="width: 22px; height: 22px; border-radius: 50%; background: {{color}}; border: 2px solid #231F1C; box-sizing: border-box"></span></button>
</div>
</sc-if>
<sc-if value="{{trayEdit}}" hint-placeholder-val="{{ false }}">
<div role="toolbar" aria-label="Edit decoration" style="display: flex; gap: 6px; width: 290px; align-items: center">
<button type="button" class="mini" onClick="{{rotL}}" aria-label="Tilt left">↺</button>
<button type="button" class="mini" onClick="{{rotR}}" aria-label="Tilt right">↻</button>
<button type="button" class="mini" onClick="{{cycleDeco}}">Colour</button>
<button type="button" class="mini" onClick="{{remove}}">Remove</button>
<button type="button" class="mini" onClick="{{deselect}}" style="background: #231F1C; color: #FFFFFF; border-color: #231F1C">Done</button>
</div>
</sc-if>
<sc-if value="{{trayItem}}" hint-placeholder-val="{{ false }}">
<div style="width: 290px; display: flex; align-items: center; gap: 8px; background: #FFFFFF; border: 1px solid #D6D6D3; border-radius: 14px; padding: 8px 10px; box-sizing: border-box">
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 14px; font-weight: 700">{{selItem}}</span><span style="font-size: 11px; color: #66615D">{{selQty}} · {{selExp}}</span></div>
<button type="button" class="mini" onClick="{{useOne}}">Use 1</button>
<button type="button" class="mini" onClick="{{restock}}">+1</button>
</div>
</sc-if>
</sc-if>

<sc-if value="{{isList}}" hint-placeholder-val="{{ false }}">
<div style="background: #FFFFFF; border: 1px solid #D6D6D3; border-radius: 16px; padding: 4px 14px">
<sc-for list="{{list}}" as="l" hint-placeholder-count="5">
<label class="row" style="cursor: pointer"><input type="checkbox" checked="{{l.done}}" onChange="{{l.toggle}}" style="width: 20px; height: 20px"><span style="flex: 1; text-decoration: {{l.strike}}">[Item] · {{l.q}}</span><span style="color: #66615D">₩0,000</span></label>
</sc-for>
<div style="display: flex; justify-content: space-between; padding: 12px 0; font-size: 13px"><span style="color: #4A4542">Est. total</span><strong>₩00,000</strong></div>
</div>
</sc-if>
</div>

<a href="M02-Camera.dc.html" aria-label="Open AI camera, ingredient scan first" style="position: absolute; right: 16px; bottom: 92px; width: 60px; height: 60px; border-radius: 50%; background: #231F1C; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(0,0,0,.2)"><span style="width: 40px; height: 40px; border-radius: 50%; background: #F9D312; display: flex; align-items: center; justify-content: center"><span style="width: 16px; height: 16px; border: 2px solid #231F1C; border-radius: 50%; box-sizing: border-box"></span></span></a>
<nav aria-label="Main tabs" style="flex: none; border-top: 1px solid #D6D6D3; background: #F6F6F4; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 6px 8px calc(12px + env(safe-area-inset-bottom)); box-sizing: border-box">
<a class="tb" href="M01-Home.dc.html"><span class="ti"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-6.5 8 6.5"></path><path d="M6 9.5V20h12V9.5"></path><path d="M10 20v-5h4v5"></path></svg></span>Home</a>
<a class="tb on" href="M07-Kitchen.dc.html" aria-current="page"><span class="ti"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11h16v5a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z"></path><path d="M2 11h20"></path><path d="M9 7.5c0-1.4 1.3-2.5 3-2.5s3 1.1 3 2.5"></path></svg></span>My Kitchen</a>
<a class="tb" href="M04-Journal.dc.html"><span class="ti"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h11a2 2 0 0 1 2 2v14H8a2 2 0 0 1-2-2z"></path><path d="M6 17a2 2 0 0 1 2-2h11"></path><path d="M10 8h5"></path></svg></span>Journal</a>
<a class="tb" href="M08-Archive.dc.html"><span class="ti"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="5" rx="1.5"></rect><path d="M5 9v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9"></path><path d="M10 13h4"></path></svg></span>Archive</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.K = {
      photo: { label: 'Photo', w: 92, h: 110, bg: '#FFFFFF', r: '3px', pad: '7px 7px 20px', ph: 1, tape: true },
      strip: { label: 'Photo strip', w: 58, h: 176, bg: '#FFFFFF', r: '2px', pad: '5px', ph: 4, tape: true },
      postit: { label: 'Post-it', w: 112, h: 104, bg: '#FDF3C0', r: '2px', pad: '10px', font: "'Caveat', cursive", fs: '21px', txt: true, col: true, def: 'note to self' },
      note: { label: 'Note card', w: 124, h: 92, bg: 'repeating-linear-gradient(180deg,#FFFFFF 0 16px,#DCDCD9 16px 17px)', r: '2px', pad: '8px', font: "'Caveat', cursive", fs: '19px', txt: true, tape: true, def: 'write something' },
      badge: { label: 'Badge', w: 66, h: 66, bg: '#FCE7A0', r: '50%', border: '3px solid #FFFFFF', fs: '10px', fw: '800', txt: true, up: true, col: true, def: 'yum!' },
      magnet: { label: 'Magnet', w: 44, h: 44, bg: '#EE6F83', r: '50% 50% 50% 8px', border: '2px solid rgba(255,255,255,.75)', col: true },
      calendar: { label: 'Calendar', w: 118, h: 150, bg: '#FFFFFF', r: '3px', pad: '6px', ph: 1, cal: true, fixed: '' },
      receipt: { label: 'Receipt', w: 72, h: 124, bg: 'repeating-linear-gradient(180deg,#FFFFFF 0 9px,#E2E2DF 9px 10px)', r: '0', pad: '6px', fs: '8px', fw: '700', tape: true, fixed: 'RECEIPT' }
    };
    let saved = null;
    try { saved = JSON.parse(window.localStorage.getItem('dailybite-fridge') || 'null'); } catch (e) { saved = null; }
    this.drag = null;
    this.state = { tab: (typeof window !== 'undefined' && /list/.test(window.location.hash || '')) ? 'To buy' : 'Fridge', sel: 'v1', done: {}, qty: { f1: 2, f2: 1, f3: 1, d1: 6, d2: 1, d3: 2, p1: 1, p2: 1, p3: 1, v1: 1, v2: 4, v3: 3, v4: 1 },
      top: false, bot: false, color: (saved && saved.color) || '#CFE0EA', decos: (saved && saved.decos) || this.defaults(), selDeco: null };
  }
  defaults() {
    return [
      { id: 'a1', k: 'strip', x: 26, y: 8, rot: -5 },
      { id: 'a2', k: 'badge', x: 106, y: 30, rot: -8, text: 'little\ntreat' },
      { id: 'a3', k: 'postit', x: 262, y: 26, rot: 5, text: 'buy oat milk!' },
      { id: 'a4', k: 'magnet', x: 196, y: 96, rot: 0 },
      { id: 'a5', k: 'calendar', x: 34, y: 262, rot: -2 },
      { id: 'a6', k: 'photo', x: 176, y: 330, rot: 4 },
      { id: 'a7', k: 'note', x: 238, y: 470, rot: -3, text: 'drink water\nown your day' },
      { id: 'a8', k: 'receipt', x: 60, y: 450, rot: 6 },
      { id: 'a9', k: 'badge', x: 300, y: 330, rot: 10, text: 'I ♥\nrice', c: '#FCE4EF' }
    ];
  }
  save(st) { try { window.localStorage.setItem('dailybite-fridge', JSON.stringify({ color: st.color, decos: st.decos })); } catch (e) {} }
  commit(patch) { const n = Object.assign({}, this.state, patch); this.setState(patch); this.save(n); }
  down(e, d) {
    if (e.button !== undefined && e.button !== 0) return;
    const box = e.currentTarget.closest('[data-fridge]'); if (!box) return;
    const r = box.getBoundingClientRect(); const sc = r.width / 400;
    this.drag = { id: d.id, dx: (e.clientX - r.left) / sc - d.x, dy: (e.clientY - r.top) / sc - d.y, box: box };
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
    if (e.preventDefault) e.preventDefault();
    this.setState({ decos: this.state.decos.filter((x) => x.id !== d.id).concat([d]), selDeco: d.id });
  }
  move(e) {
    const g = this.drag; if (!g) return;
    const r = g.box.getBoundingClientRect(); const sc = r.width / 400;
    const d = this.state.decos.find((x) => x.id === g.id); if (!d) return; const k = this.K[d.k];
    let x = (e.clientX - r.left) / sc - g.dx, y = (e.clientY - r.top) / sc - g.dy;
    x = Math.max(-12, Math.min(412 - k.w, x)); y = Math.max(-12, Math.min(632 - k.h, y));
    this.setState({ decos: this.state.decos.map((z) => z.id === g.id ? Object.assign({}, z, { x: Math.round(x), y: Math.round(y) }) : z) });
  }
  up() { if (this.drag) { this.drag = null; this.save(this.state); } }
  renderVals() {
    const s = this.state; const K = this.K; const isOpen = s.top || s.bot;
    const tabs = ['Fridge', 'To buy'].map((t) => ({ l: t === 'Fridge' ? 'Stock' : t, on: String(s.tab === t), bg: s.tab === t ? '#FFFFFF' : 'transparent', pick: () => this.setState({ tab: t }) }));
    const defs = { f1: ['Dumplings', 'bags', 60, 'frozen'], f2: ['Berries', 'bag', 21, 'frozen'], f3: ['Ice cream', 'tub', 30, 'frozen'],
      d1: ['Eggs', 'pcs', 12, 'dairy'], d2: ['Milk', 'L', 5, 'dairy'], d3: ['Yogurt', 'cups', 2, 'dairy'],
      p1: ['Chicken', 'pack', 2, 'protein'], p2: ['Tofu', 'block', 4, 'protein'], p3: ['Kimchi', 'jar', 21, 'protein'],
      v1: ['Spinach', 'bag', 1, 'veg'], v2: ['Apples', 'pcs', 9, 'veg'], v3: ['Carrots', 'pcs', 6, 'veg'], v4: ['Scallion', 'bunch', 5, 'veg'] };
    const expLabel = (n) => n >= 60 ? Math.round(n / 30) + ' mo' : (n >= 14 ? Math.round(n / 7) + ' wk' : n + ' d');
    const item = (id) => { const d = defs[id]; const q = s.qty[id]; const on = s.sel === id && isOpen; const soon = d[2] <= 2; const low = q <= 1;
      return { name: d[0], aria: d[0] + ', ' + q + ' ' + d[1], flag: q === 0 ? 'out' : (soon ? 'use in ' + d[2] + 'd' : (low ? 'low' : expLabel(d[2]))),
        fc: q === 0 || soon || low ? '#9E2A0E' : '#66615D', bg: on ? '#FFFFFF' : 'transparent', ring: on ? '2px solid #231F1C' : 'none', pick: () => this.setState({ sel: id }) }; };
    const ids = Object.keys(defs); const by = (c) => ids.filter((i) => defs[i][3] === c).map(item); const veg = by('veg');
    const mk = (d, door) => { const k = K[d.k]; const on = s.selDeco === d.id;
      return { aria: k.label + (d.text ? ': ' + d.text.replace(/\n/g, ' ') : '') + '. Drag to move.', x: d.x, y: door === 'bot' ? d.y - 200 : d.y, w: k.w, h: k.h, rot: d.rot || 0,
        bg: k.col && d.c ? d.c : k.bg, r: k.r, border: k.border || '0', pad: k.pad || '0', ring: on ? '2px dashed #231F1C' : 'none', tape: !!k.tape, cal: !!k.cal,
        phs: Array.from({ length: k.ph || 0 }, (v, j) => ({ j: j })), text: k.txt ? (d.text || '') : (k.fixed || ''),
        font: k.font || 'Inter, sans-serif', fs: k.fs || '10px', fw: k.fw || '600', tt: k.up ? 'uppercase' : 'none', down: (e) => this.down(e, d) }; };
    const pal = ['#CFE0EA', '#D5E2C4', '#F1EBDD', '#FCE7A0', '#FCE4EF', '#6B6C66'];
    const dpal = ['#FDF3C0', '#FCE7A0', '#FCE4EF', '#D6E4EE', '#EE6F83', '#FFFFFF'];
    const sel = s.decos.find((d) => d.id === s.selDeco);
    const updSel = (p) => this.commit({ decos: s.decos.map((d) => d.id === s.selDeco ? Object.assign({}, d, p) : d) });
    const kinds = ['photo', 'postit', 'note', 'badge', 'magnet'].map((key) => { const k = K[key];
      return { aria: 'Add ' + k.label, iw: Math.round(k.w / 4) + 'px', ih: Math.round(k.h / 4) + 'px', ir: k.r === '50%' ? '50%' : '3px', ibg: k.col ? k.bg : '#FFFFFF',
        add: () => { const id = 'n' + Date.now().toString(36); const nd = { id: id, k: key, x: Math.round(200 - k.w / 2), y: Math.round(380 - k.h / 2), rot: Math.round(Math.random() * 10 - 5) };
          if (k.txt) nd.text = k.def; this.commit({ decos: s.decos.concat([nd]), selDeco: id, top: false, bot: false }); } }; });
    const sd = defs[s.sel];
    const list = [['l1', '2 pcs'], ['l2', '1 L'], ['l3', '300 g'], ['l4', '1 pack'], ['l5', '6 pcs']].map((l) => ({ q: l[1], done: !!s.done[l[0]], strike: s.done[l[0]] ? 'line-through' : 'none',
      toggle: () => { const d = Object.assign({}, s.done); d[l[0]] = !d[l[0]]; this.setState({ done: d }); } }));
    return {
      tabs, list, isFridge: s.tab === 'Fridge', isList: s.tab === 'To buy', color: s.color,
      topT: s.top ? 'rotateY(-112deg)' : 'rotateY(0deg)', botT: s.bot ? 'rotateY(-112deg)' : 'rotateY(0deg)',
      topPE: s.top ? 'none' : 'auto', botPE: s.bot ? 'none' : 'auto', insideHidden: String(!isOpen),
      topAria: s.top ? 'Close freezer door' : 'Open freezer door', botAria: s.bot ? 'Close fridge door' : 'Open fridge door',
      toggleTop: () => this.setState({ top: !s.top, selDeco: null }), toggleBot: () => this.setState({ bot: !s.bot, selDeco: null }),
      openAll: () => this.setState({ top: true, bot: true, selDeco: null }),
      toggleAll: () => this.setState({ tab: 'Fridge', top: !isOpen, bot: !isOpen, selDeco: null }), allLabel: isOpen ? 'Close' : 'Open fridge',
      move: (e) => this.move(e), up: () => this.up(),
      topDecos: s.decos.filter((d) => d.y + K[d.k].h / 2 < 195).map((d) => mk(d, 'top')),
      botDecos: s.decos.filter((d) => d.y + K[d.k].h / 2 >= 195).map((d) => mk(d, 'bot')),
      soonCount: String(ids.filter((i) => defs[i][2] <= 2 && s.qty[i] > 0).length), lowCount: String(ids.filter((i) => s.qty[i] <= 1).length),
      frozen: by('frozen'), shelves: [{ name: 'Dairy & eggs', items: by('dairy') }, { name: 'Proteins', items: by('protein') }],
      drawers: [{ items: veg.slice(0, 2) }, { items: veg.slice(2) }],
      kinds, trayAdd: !isOpen && !sel, trayEdit: !isOpen && !!sel, trayItem: isOpen,
      cycleColor: () => this.commit({ color: pal[(pal.indexOf(s.color) + 1) % pal.length] }),
      cycleDeco: () => { if (!sel) return; const cur = sel.c || K[sel.k].bg; updSel({ c: dpal[(dpal.indexOf(cur) + 1) % dpal.length] }); },
      rotL: () => sel && updSel({ rot: (sel.rot || 0) - 5 }), rotR: () => sel && updSel({ rot: (sel.rot || 0) + 5 }),
      remove: () => this.commit({ decos: s.decos.filter((d) => d.id !== s.selDeco), selDeco: null }), deselect: () => this.setState({ selDeco: null }),
      selItem: sd[0], selQty: s.qty[s.sel] + ' ' + sd[1], selExp: 'expires in ' + expLabel(sd[2]),
      useOne: () => { const q = Object.assign({}, s.qty); q[s.sel] = Math.max(0, q[s.sel] - 1); this.setState({ qty: q }); },
      restock: () => { const q = Object.assign({}, s.qty); q[s.sel] = q[s.sel] + 1; this.setState({ qty: q }); }
    };
  }
}
