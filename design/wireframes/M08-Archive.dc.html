<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile archive</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Caveat:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EDEDEB}
a{color:#231F1C}
h1,h2,h3,p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ph{background-color:#E2E2DF;background-image:linear-gradient(to top right,transparent calc(50% - 0.7px),#C9C9C6 50%,transparent calc(50% + 0.7px)),linear-gradient(to bottom right,transparent calc(50% - 0.7px),#C9C9C6 50%,transparent calc(50% + 0.7px))}
.lbl{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#66615D}
.fc{all:unset;cursor:pointer;box-sizing:border-box;flex:none;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid #C9C9C6;font-size:12px;font-weight:600;display:flex;align-items:center}
.day{display:flex;gap:12px;align-items:center;padding:10px;background:#FFFFFF;border:1px solid #D6D6D3;border-radius:14px;text-decoration:none;color:#231F1C}
.chip{display:inline-flex;align-items:center;min-height:22px;padding:0 8px;border-radius:999px;border:1px solid #C9C9C6;font-size:11px;color:#4A4542;background:#FFFFFF;box-sizing:border-box}
.tb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:#66615D;text-decoration:none;min-height:56px}
.tb .ti{width:56px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center}
.tb.on{color:#0F5C85;font-weight:700}
.tb.on .ti{background:#D9E9F5}
.vt{display:inline-flex;gap:4px;padding:4px;background:#E2E2DF;border-radius:12px;align-self:flex-start}
.vt a{min-height:38px;padding:0 16px;border-radius:9px;display:flex;align-items:center;font-size:13px;font-weight:600;color:#4A4542;text-decoration:none}
.vt a[aria-current="page"]{background:#FFFFFF;color:#231F1C}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #EDEDEB; font-family: Inter, system-ui, sans-serif; color: #231F1C; display: flex; flex-direction: column">
<div style="flex: 1; overflow-y: auto; padding: 18px 16px 88px; display: flex; flex-direction: column; gap: 12px">
<header style="display: flex; align-items: center; gap: 10px">
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span class="lbl">Archive</span><h1 style="font-size: 22px; font-weight: 700">My food journey</h1></div>
</header>
<nav aria-label="Archive views" class="vt"><a href="M08-Archive.dc.html" aria-current="page">List</a><a href="M06-Calendar.dc.html">Calendar</a></nav>

<label style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border: 1px solid #C9C9C6; border-radius: 12px; background: #FFFFFF; color: #66615D"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4.5-4.5"></path></svg><span class="sr">Search archive</span><input type="search" placeholder="Search meals, notes, recipes" value="{{q}}" onInput="{{onSearch}}" style="border: 0; outline: 0; background: transparent; font: inherit; font-size: 14px; flex: 1; min-width: 0; color: #231F1C"></label>

<div style="display: flex; gap: 8px; align-items: center">
<label style="flex: 1; display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: #66615D">From<input type="date" value="2026-10-01" style="min-height: 40px; border: 1px solid #C9C9C6; border-radius: 10px; padding: 0 8px; font: inherit; font-size: 13px; color: #231F1C; background: #FFFFFF"></label>
<label style="flex: 1; display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: #66615D">To<input type="date" value="2026-11-03" style="min-height: 40px; border: 1px solid #C9C9C6; border-radius: 10px; padding: 0 8px; font: inherit; font-size: 13px; color: #231F1C; background: #FFFFFF"></label>
</div>

<div role="group" aria-label="Filter by type" style="display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="5"><button type="button" class="fc" aria-pressed="{{f.on}}" onClick="{{f.pick}}" style="background: {{f.bg}}; color: {{f.fg}}; border-color: {{f.bd}}">{{f.label}}</button></sc-for>
</div>

<sc-for list="{{groups}}" as="grp" hint-placeholder-count="2">
<section style="display: flex; flex-direction: column; gap: 8px">
<span class="lbl" style="padding-top: 4px">{{grp.title}}</span>
<sc-for list="{{grp.items}}" as="d" hint-placeholder-count="3">
<a class="day" href="{{d.href}}"><span class="ph" style="width: 56px; height: 56px; border-radius: 10px; flex: none"></span><span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 14px; font-weight: 600">{{d.date}}</span><span style="font-size: 12px; color: #66615D">{{d.meta}}</span><span class="chip" style="align-self: flex-start">{{d.kind}}</span></span><span aria-hidden="true" style="color: #66615D">›</span></a>
</sc-for>
</section>
</sc-for>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}"><p style="padding: 24px 0; text-align: center; font-size: 13px; color: #66615D">No entries match. Try another filter.</p></sc-if>
</div>

<a href="M02-Camera.dc.html" aria-label="Open AI camera" style="position: absolute; right: 16px; bottom: 96px; width: 60px; height: 60px; border-radius: 50%; background: #231F1C; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(0,0,0,.2)"><span style="width: 40px; height: 40px; border-radius: 50%; background: #F9D312; display: flex; align-items: center; justify-content: center"><span style="width: 16px; height: 16px; border: 2px solid #231F1C; border-radius: 50%; box-sizing: border-box"></span></span></a>

<nav aria-label="Main tabs" style="flex: none; border-top: 1px solid #D6D6D3; background: #F6F6F4; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 6px 8px calc(12px + env(safe-area-inset-bottom)); box-sizing: border-box">
<a class="tb" href="M01-Home.dc.html"><span class="ti"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-6.5 8 6.5"></path><path d="M6 9.5V20h12V9.5"></path><path d="M10 20v-5h4v5"></path></svg></span>Home</a>
<a class="tb" href="M07-Kitchen.dc.html"><span class="ti"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11h16v5a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z"></path><path d="M2 11h20"></path><path d="M9 7.5c0-1.4 1.3-2.5 3-2.5s3 1.1 3 2.5"></path></svg></span>My Kitchen</a>
<a class="tb" href="M04-Journal.dc.html"><span class="ti"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h11a2 2 0 0 1 2 2v14H8a2 2 0 0 1-2-2z"></path><path d="M6 17a2 2 0 0 1 2-2h11"></path><path d="M10 8h5"></path></svg></span>Journal</a>
<a class="tb on" href="M08-Archive.dc.html" aria-current="page"><span class="ti"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="5" rx="1.5"></rect><path d="M5 9v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9"></path><path d="M10 13h4"></path></svg></span>Archive</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { f: 'All', q: '' }; }
  renderVals() {
    const s = this.state;
    const all = [
      { g: 'This week', date: 'Mon 2 Nov', meta: '3 meals · 0,000 kcal · P 00 g', kind: 'Journal', href: 'M04-Journal.dc.html' },
      { g: 'This week', date: 'Sun 1 Nov', meta: 'Breakfast · lunch · dinner', kind: 'Meals', href: 'M04-Journal.dc.html' },
      { g: 'This week', date: 'Sun 1 Nov', meta: '0,000 kcal · goal met', kind: 'Nutrition', href: 'D08-Progress.dc.html' },
      { g: 'Last week', date: 'Fri 30 Oct', meta: '4 planned · 3 eaten', kind: 'Meal plans', href: 'M06-Calendar.dc.html' },
      { g: 'Last week', date: 'Thu 29 Oct', meta: '"[first line of that day’s review]"', kind: 'Journal', href: 'M04-Journal.dc.html' },
      { g: 'Last week', date: 'Wed 28 Oct', meta: '0,000 kcal · P 00 g · C 00 g', kind: 'Nutrition', href: 'D08-Progress.dc.html' },
      { g: 'October', date: 'Week of 19 Oct', meta: '18 meals logged · 5 plans', kind: 'Meal plans', href: 'M06-Calendar.dc.html' },
      { g: 'October', date: 'Sat 17 Oct', meta: '[Meal name] · 000 kcal', kind: 'Meals', href: 'M04-Journal.dc.html' }
    ];
    const q = (s.q || '').toLowerCase();
    const shown = all.filter((d) => (s.f === 'All' || d.kind === s.f) && (!q || (d.date + ' ' + d.meta + ' ' + d.kind).toLowerCase().indexOf(q) >= 0));
    const order = [];
    shown.forEach((d) => { if (order.indexOf(d.g) < 0) order.push(d.g); });
    const groups = order.map((g) => ({ title: g, items: shown.filter((d) => d.g === g) }));
    const filters = ['All', 'Journal', 'Meals', 'Nutrition', 'Meal plans'].map((f) => ({ label: f, on: String(s.f === f),
      bg: s.f === f ? '#D9E9F5' : '#FFFFFF', fg: s.f === f ? '#231F1C' : '#4A4542', bd: s.f === f ? '#0A73B8' : '#C9C9C6',
      pick: () => this.setState({ f: f }) }));
    return { groups, filters, q: s.q, empty: shown.length === 0, onSearch: (e) => this.setState({ q: e.target.value }) };
  }
}
</script>
</body>
</html>
