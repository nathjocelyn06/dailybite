<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile camera action sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#2E2E2B}
a{color:#231F1C}
h1,h2,h3,p{margin:0}
.ic{width:20px;height:20px;flex:none;border:1.5px solid currentColor;border-radius:50%;box-sizing:border-box}
.act{all:unset;cursor:pointer;box-sizing:border-box;border-radius:14px;padding:10px 6px;min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;font-size:11px;font-weight:600}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #2E2E2B; font-family: Inter, system-ui, sans-serif; color: #231F1C">
<div style="position: absolute; left: 16px; right: 16px; top: 16px; display: flex; justify-content: space-between; align-items: center">
<a href="M01-Home.dc.html" aria-label="Close camera" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #66615D; color: #FFFFFF; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 20px">×</a>
<span style="color: #FFFFFF; font-size: 14px; font-weight: 600">{{title}}</span>
<span style="width: 44px"></span>
</div>
<div style="position: absolute; left: 24px; right: 24px; top: 84px; height: 330px; border-radius: 16px; background: #3D3D39">
<span style="position: absolute; left: 14px; top: 14px; width: 28px; height: 28px; border-left: 3px solid #FFFFFF; border-top: 3px solid #FFFFFF"></span>
<span style="position: absolute; right: 14px; top: 14px; width: 28px; height: 28px; border-right: 3px solid #FFFFFF; border-top: 3px solid #FFFFFF"></span>
<span style="position: absolute; left: 14px; bottom: 14px; width: 28px; height: 28px; border-left: 3px solid #FFFFFF; border-bottom: 3px solid #FFFFFF"></span>
<span style="position: absolute; right: 14px; bottom: 14px; width: 28px; height: 28px; border-right: 3px solid #FFFFFF; border-bottom: 3px solid #FFFFFF"></span>
<span style="position: absolute; left: 0; right: 0; bottom: 40px; text-align: center; color: #DCDCD9; font-size: 13px">{{hint}}</span>
</div>

<section role="dialog" aria-label="Choose a scan" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 12px 16px 24px; display: flex; flex-direction: column; gap: 12px">
<span style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #C9C9C6"></span>
<span style="font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #66615D">What are you scanning?</span>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{acts}}" as="a" hint-placeholder-count="6">
<button type="button" class="act" onClick="{{a.pick}}" aria-pressed="{{a.on}}" style="background: {{a.bg}}; border: {{a.border}}"><span class="ic"></span>{{a.label}}</button>
</sc-for>
</div>
<span style="font-size: 12px; color: #4A4542">{{desc}}</span>
<div style="display: flex; align-items: center; gap: 12px">
<button type="button" style="all: unset; cursor: pointer; flex: 1; min-height: 48px; border: 1px solid #C9C9C6; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600">Upload</button>
<a href="M03-Confirm.dc.html" aria-label="Take photo" style="width: 68px; height: 68px; border-radius: 50%; border: 4px solid #231F1C; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><span style="width: 50px; height: 50px; border-radius: 50%; background: #F9D312"></span></a>
<span style="flex: 1; font-size: 11px; color: #66615D; text-align: center">AI suggests,<br>you confirm</span>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { act: 'Calorie scan' }; }
  renderVals() {
    const d = {
      'Calorie scan': 'Identify food and estimate nutrition.', 'Receipt scan': 'Read merchant, items and total for Budgeting.',
      'Ingredient scan': 'Spot groceries and suggest fridge updates.', 'Recipe finder': 'Get recipes from the ingredients in view.',
      'Food journal': 'Add this photo to today\'s journal page.', 'Grocery scan': 'Tick bought items off your shopping list.'
    };
    const acts = Object.keys(d).map((k) => ({ label: k, on: String(this.state.act === k), bg: this.state.act === k ? '#D9E9F5' : '#EDEDEB',
      border: this.state.act === k ? '2px solid #231F1C' : '1px solid transparent', pick: () => this.setState({ act: k }) }));
    return { acts, title: this.state.act, desc: d[this.state.act], hint: this.state.act === 'Receipt scan' ? 'Fit the whole receipt in the frame' : 'Point at your food' };
  }
}
</script>
</body>
</html>
