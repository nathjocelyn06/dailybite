<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Healthy Menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F6F4}
a{color:#0A73B8}a:hover{color:#0F5C85}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</helmet>
<div style="font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #1E1F1B; background: #F6F6F4; min-height: 920px; display: flex; flex-wrap: wrap; align-items: stretch">

<nav aria-label="Main" style="flex: 1 0 248px; max-width: 280px; box-sizing: border-box; background: #FFFFFF; border-right: 1px solid #E2E2DF; padding: 28px 18px 24px; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 10px">
<div style="width: 34px; height: 34px; border-radius: 10px; background: #0A73B8; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18a9 9 0 0 1-18 0zM12 12c0-4 2-7 6-8M12 12c-1-3-3-5-6-5"></path></svg>
</div>
<span style="font-size: 20px; font-weight: 700; letter-spacing: -0.02em">Bowlful</span>
</div>

<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #66615D; padding: 0 12px 8px">Menu</span>
<sc-for list="{{nav}}" as="item" hint-placeholder-count="7">
<div style="display: flex; flex-direction: column; gap: 2px">
<button type="button" onClick="{{item.pick}}" aria-current="{{item.current}}" aria-expanded="{{item.expanded}}" style="all: unset; box-sizing: border-box; cursor: pointer; min-height: 44px; width: 100%; display: flex; align-items: center; gap: 12px; padding: 0 12px; border-radius: 12px; font-size: 14px; font-weight: {{item.weight}}; background: {{item.bg}}; color: {{item.fg}}">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="{{item.icon}}"></path></svg>
<span style="flex: 1">{{item.label}}</span>
<sc-if value="{{item.hasSub}}" hint-placeholder-val="{{ false }}">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="transform: {{item.chevron}}; transition: transform .2s"><path d="M6 9l6 6 6-6"></path></svg>
</sc-if>
</button>
<sc-if value="{{item.showSub}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 2px; margin: 2px 0 4px 21px; padding-left: 12px; border-left: 1px solid #E2E2DF">
<sc-for list="{{subs}}" as="sub" hint-placeholder-count="3">
<button type="button" onClick="{{sub.pick}}" aria-current="{{sub.current}}" style="all: unset; box-sizing: border-box; cursor: pointer; min-height: 40px; display: flex; align-items: center; padding: 0 12px; border-radius: 10px; font-size: 13px; font-weight: {{sub.weight}}; color: {{sub.fg}}; background: {{sub.bg}}">{{sub.label}}</button>
</sc-for>
</div>
</sc-if>
</div>
</sc-for>
</div>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 4px; border-top: 1px solid #E2E2DF; padding-top: 16px">
<button type="button" style="all: unset; box-sizing: border-box; cursor: pointer; min-height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border-radius: 12px; font-size: 14px; color: #4A4542">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"></path></svg>
Settings</button>
<button type="button" style="all: unset; box-sizing: border-box; cursor: pointer; min-height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border-radius: 12px; font-size: 14px; color: #4A4542">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5H5v14h5M14 8l4 4-4 4M18 12H9"></path></svg>
Log out</button>
</div>
</nav>

<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 32px 36px 40px; display: flex; flex-direction: column; gap: 24px">
<header style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px">
<div style="flex: 1 1 240px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 13px; color: #66615D">{{crumb}}</span>
<h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">{{title}}</h1>
</div>
<label style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; background: #FFFFFF; border: 1px solid #E2E2DF; border-radius: 12px; flex: 0 1 280px; color: #66615D">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4"></path></svg>
<span class="sr">Search recipes</span>
<input type="search" placeholder="Search recipes or ingredients" style="border: 0; outline: 0; background: transparent; font: inherit; font-size: 14px; color: #1E1F1B; flex: 1; min-width: 0">
</label>
<button type="button" style="all: unset; box-sizing: border-box; cursor: pointer; height: 44px; padding: 0 18px; border-radius: 12px; background: #0A73B8; color: #FFFFFF; font-size: 14px; font-weight: 600">Add to meal plan</button>
</header>

<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
<section aria-label="Recipes" style="flex: 999 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<div style="background: #FFFFFF; border: 1px solid #E2E2DF; border-radius: 20px; padding: 20px; display: flex; flex-wrap: wrap; gap: 20px">
<div style="flex: 1 1 240px; min-height: 200px; border-radius: 14px; background: #E6E6E3; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #66615D">[Featured recipe photo]</div>
<div style="flex: 1 1 240px; display: flex; flex-direction: column; gap: 12px">
<span style="align-self: flex-start; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: #D9E9F5; color: #0F5C85">Featured</span>
<div style="height: 22px; width: 85%; border-radius: 6px; background: #E6E6E3"></div>
<div style="height: 22px; width: 60%; border-radius: 6px; background: #E6E6E3"></div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 8px">
<div style="border-radius: 10px; background: #F6F6F4; padding: 10px; font-size: 12px; color: #4A4542">Calories</div>
<div style="border-radius: 10px; background: #F6F6F4; padding: 10px; font-size: 12px; color: #4A4542">Carbs</div>
<div style="border-radius: 10px; background: #F6F6F4; padding: 10px; font-size: 12px; color: #4A4542">Protein</div>
<div style="border-radius: 10px; background: #F6F6F4; padding: 10px; font-size: 12px; color: #4A4542">Fat</div>
</div>
</div>
</div>

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
<h2 style="margin: 0 12px 0 0; font-size: 18px; font-weight: 700">All recipes</h2>
<sc-for list="{{tabs}}" as="tab" hint-placeholder-count="5">
<button type="button" onClick="{{tab.pick}}" aria-pressed="{{tab.on}}" style="all: unset; box-sizing: border-box; cursor: pointer; height: 36px; padding: 0 14px; border-radius: 999px; font-size: 13px; font-weight: 500; background: {{tab.bg}}; color: {{tab.fg}}">{{tab.label}}</button>
</sc-for>
</div>

<sc-for list="{{rows}}" as="row" hint-placeholder-count="3">
<div style="background: #FFFFFF; border: 1px solid #E2E2DF; border-radius: 16px; padding: 14px; display: flex; align-items: center; gap: 16px">
<div style="width: 96px; height: 72px; flex: none; border-radius: 12px; background: #E6E6E3"></div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 8px">
<div style="height: 16px; width: 55%; border-radius: 5px; background: #E6E6E3"></div>
<div style="height: 12px; width: 35%; border-radius: 5px; background: #EDEDEB"></div>
</div>
<span style="font-size: 13px; color: #66615D">[Recipe {{row.n}}]</span>
</div>
</sc-for>
</section>

<aside aria-label="Suggestions" style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 16px">
<div style="background: #FFFFFF; border: 1px solid #E2E2DF; border-radius: 16px; padding: 16px; display: flex; align-items: center; gap: 12px">
<div style="width: 44px; height: 44px; border-radius: 50%; background: #D9E9F5"></div>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 14px; font-weight: 600">[Your name]</span>
<span style="font-size: 12px; color: #66615D">Member</span>
</div>
</div>
<div style="background: #FFFFFF; border: 1px solid #E2E2DF; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 15px; font-weight: 700">From your fridge</h2>
<div style="height: 56px; border-radius: 10px; background: #F6F6F4"></div>
<div style="height: 56px; border-radius: 10px; background: #F6F6F4"></div>
</div>
<div style="background: #FFFFFF; border: 1px solid #E2E2DF; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 15px; font-weight: 700">Recommended for you</h2>
<div style="height: 56px; border-radius: 10px; background: #F6F6F4"></div>
<div style="height: 56px; border-radius: 10px; background: #F6F6F4"></div>
<div style="height: 56px; border-radius: 10px; background: #F6F6F4"></div>
</div>
</aside>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":920}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { active: 'menu', sub: null, mealOpen: true, tab: 'All' };
  }
  renderVals() {
    const s = this.state;
    const items = [
      { id: 'dash', label: 'Dashboard', icon: 'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z' },
      { id: 'cal', label: 'Calendar & progress', icon: 'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4M8 15l3 2 5-4' },
      { id: 'menu', label: 'Healthy menu', icon: 'M3 12h18a9 9 0 0 1-18 0zM8 8c0-2 2-2 2-4M13 8c0-2 2-2 2-4' },
      { id: 'plan', label: 'Meal plan', icon: 'M8 3h8v4H8zM6 5H5v16h14V5h-1M9 12h6M9 16h4', hasSub: true },
      { id: 'journal', label: 'Food journal', icon: 'M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM5 17a3 3 0 0 1 3-3h11' },
      { id: 'budget', label: 'Budgeting', icon: 'M4 7h16v12H4zM4 7l12-3v3M16 13h2' },
      { id: 'insight', label: 'Health insights', icon: 'M12 20s-7-4.5-8.5-9A4.5 4.5 0 0 1 12 7a4.5 4.5 0 0 1 8.5 4c-1.5 4.5-8.5 9-8.5 9zM7 12h3l1-2 2 4 1-2h3' }
    ];
    const subList = [
      { id: 'week', label: 'This week' },
      { id: 'saved', label: 'Saved plans' },
      { id: 'sync', label: 'Calendar sync' }
    ];
    const nav = items.map((it) => {
      const on = s.active === it.id && !(it.hasSub && s.sub);
      const inPlan = it.hasSub && s.active === 'plan';
      return {
        ...it,
        hasSub: !!it.hasSub,
        showSub: !!it.hasSub && s.mealOpen,
        expanded: it.hasSub ? String(s.mealOpen) : undefined,
        current: on ? 'page' : undefined,
        chevron: s.mealOpen ? 'rotate(180deg)' : 'rotate(0deg)',
        bg: on ? '#D9E9F5' : 'transparent',
        fg: on || inPlan ? '#0F5C85' : '#4A4542',
        weight: on || inPlan ? '600' : '500',
        pick: () => it.hasSub
          ? this.setState({ mealOpen: !s.mealOpen })
          : this.setState({ active: it.id, sub: null })
      };
    });
    const subs = subList.map((sb) => {
      const on = s.active === 'plan' && s.sub === sb.id;
      return {
        ...sb,
        current: on ? 'page' : undefined,
        bg: on ? '#D9E9F5' : 'transparent',
        fg: on ? '#0F5C85' : '#4A4542',
        weight: on ? '600' : '400',
        pick: () => this.setState({ active: 'plan', sub: sb.id })
      };
    });
    const activeItem = items.find((i) => i.id === s.active);
    const activeSub = subList.find((x) => x.id === s.sub);
    const title = activeSub ? activeSub.label : activeItem.label;
    const crumb = activeSub ? 'Meal plan' : 'Bowlful';
    const tabs = ['All', 'Breakfast', 'Lunch', 'Snack', 'Dinner'].map((t) => ({
      label: t,
      on: String(s.tab === t),
      bg: s.tab === t ? '#1E1F1B' : '#FFFFFF',
      fg: s.tab === t ? '#FFFFFF' : '#4A4542',
      pick: () => this.setState({ tab: t })
    }));
    return { nav, subs, title, crumb, tabs, rows: [{ n: 1 }, { n: 2 }, { n: 3 }] };
  }
}
</script>
</body>
</html>
