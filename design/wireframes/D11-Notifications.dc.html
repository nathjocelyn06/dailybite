<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notifications</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EDEDEB}
a{color:#231F1C}a:hover{color:#000}
h1,h2,h3,p{margin:0}
.ph{background-color:#E2E2DF;background-image:linear-gradient(to top right,transparent calc(50% - 0.7px),#C9C9C6 50%,transparent calc(50% + 0.7px)),linear-gradient(to bottom right,transparent calc(50% - 0.7px),#C9C9C6 50%,transparent calc(50% + 0.7px))}
.ic{width:16px;height:16px;flex:none;border:1.5px solid currentColor;border-radius:5px;box-sizing:border-box}
.nv{display:flex;align-items:center;gap:12px;min-height:42px;padding:0 12px;border-radius:10px;font-size:14px;color:#4A4542;text-decoration:none}
.nv:hover{background:#E6E6E3;color:#231F1C}
.nv.on{background:#D9E9F5;color:#231F1C;font-weight:600}
.bdg{margin-left:auto;min-width:20px;height:20px;border-radius:10px;background:#231F1C;color:#FFFFFF;font-size:11px;display:flex;align-items:center;justify-content:center}
.card{background:#FFFFFF;border:1px solid #D6D6D3;border-radius:16px;box-sizing:border-box}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 14px;border-radius:12px;font:inherit;font-size:13px;font-weight:600;border:1px solid #C9C9C6;background:#FFFFFF;color:#231F1C;text-decoration:none;cursor:pointer;box-sizing:border-box}
.chip{display:inline-flex;align-items:center;min-height:28px;padding:0 10px;border-radius:999px;border:1px solid #C9C9C6;font:inherit;font-size:12px;color:#4A4542;background:#FFFFFF;box-sizing:border-box}
.lbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#66615D}
.row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #E4E4E1;font-size:14px}
.fab{pointer-events:auto;display:flex;align-items:center;gap:10px;min-height:56px;padding:0 20px 0 8px;border-radius:999px;background:#231F1C;color:#FFFFFF;text-decoration:none;font-size:14px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.16)}
.fab:hover{color:#FFFFFF;background:#000}
.fab .dot{width:40px;height:40px;border-radius:50%;background:#F9D312;display:flex;align-items:center;justify-content:center}
.fab .dot span{width:16px;height:16px;border:2px solid #231F1C;border-radius:50%;box-sizing:border-box}
.nv{position:relative}
.nv .ni{width:22px;height:22px;flex:none;display:flex;align-items:center;justify-content:center;color:#66615D}
.nv.on{background:#D9E9F5;color:#231F1C;font-weight:600}
.nv.on .ni{color:#0F5C85}
.nv.sm{min-height:40px;font-size:13px}
.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;color:#66615D}
.crumb a{color:#4A4542;text-underline-offset:3px;min-height:28px;display:inline-flex;align-items:center}
@media (min-width:761px) and (max-width:1100px){
nav.side{flex:0 0 96px !important;max-width:96px !important;padding:20px 8px !important}
nav.side .bt,nav.side .acct .lbl,nav.side .pf .nt{display:none}
nav.side .brand{justify-content:center;padding:0 !important}
nav.side .pf{justify-content:center;padding:8px 0 !important}
nav.side .nv{flex-direction:column;gap:4px;font-size:11px;text-align:center;padding:8px 4px;min-height:62px;justify-content:center}
nav.side .nv .bdg{position:absolute;top:6px;right:14px;margin:0}
}
@media (max-width:760px){
nav.side{position:fixed !important;left:0;right:0;bottom:0;z-index:30;flex:none !important;max-width:none !important;width:100%;flex-direction:row !important;padding:6px 8px calc(8px + env(safe-area-inset-bottom)) !important;border-right:0 !important;border-top:1px solid #D6D6D3;gap:0 !important}
nav.side .brand,nav.side .acct{display:none !important}
nav.side .nvg{flex:1;display:grid !important;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px !important}
nav.side .nv{flex-direction:column;gap:3px;font-size:11px;min-height:56px;padding:4px;justify-content:center;text-align:center}
main{padding-bottom:110px !important}
main > div[style*="sticky"]{bottom:92px !important}
}
</style>
</helmet>
<div style="font-family: Inter, system-ui, sans-serif; color: #231F1C; background: #EDEDEB; min-height: 1100px; display: flex; flex-wrap: wrap; align-items: stretch">

<nav aria-label="Main" class="side" style="flex: 1 0 232px; max-width: 248px; box-sizing: border-box; background: #F6F6F4; border-right: 1px solid #D6D6D3; padding: 24px 14px; display: flex; flex-direction: column; gap: 18px">
<a href="D01-Dashboard.dc.html" class="brand" aria-label="DailyBite home" style="display: flex; align-items: center; gap: 10px; padding: 0 10px; text-decoration: none; color: #231F1C"><span style="width: 32px; height: 32px; border-radius: 9px; background: #F9D312; display: flex; align-items: center; justify-content: center; flex: none"><span style="width: 16px; height: 16px; border-radius: 50%; border: 2.5px solid #231F1C; box-sizing: border-box"></span></span><span class="bt" style="font-size: 18px; font-weight: 700">DailyBite</span></a>
<div class="nvg" style="display: flex; flex-direction: column; gap: 4px">
<a href="D01-Dashboard.dc.html" class="nv"><span class="ni"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-6.5 8 6.5"></path><path d="M6 9.5V20h12V9.5"></path><path d="M10 20v-5h4v5"></path></svg></span><span class="nt">Home</span></a>
<a href="D00-Kitchen.dc.html" class="nv"><span class="ni"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11h16v5a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z"></path><path d="M2 11h20"></path><path d="M9 7.5c0-1.4 1.3-2.5 3-2.5s3 1.1 3 2.5"></path></svg></span><span class="nt">My Kitchen</span></a>
<a href="D05-Journal.dc.html" class="nv"><span class="ni"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h11a2 2 0 0 1 2 2v14H8a2 2 0 0 1-2-2z"></path><path d="M6 17a2 2 0 0 1 2-2h11"></path><path d="M10 8h5"></path></svg></span><span class="nt">Journal</span></a>
<a href="D09-Archive.dc.html" class="nv"><span class="ni"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="5" rx="1.5"></rect><path d="M5 9v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9"></path><path d="M10 13h4"></path></svg></span><span class="nt">Archive</span></a>
</div>
<div class="acct" style="margin-top: auto; border-top: 1px solid #D6D6D3; padding-top: 14px; display: flex; flex-direction: column; gap: 2px">
<a href="D11-Notifications.dc.html" class="nv sm on" aria-current="page"><span class="ni"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg></span><span class="nt">Notifications</span><span class="bdg">4</span></a>
<a href="#" class="nv sm"><span class="ni"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"></path></svg></span><span class="nt">Settings</span></a>
<div class="pf" style="display: flex; align-items: center; gap: 10px; padding: 8px 12px"><span class="ph" style="width: 32px; height: 32px; border-radius: 50%; flex: none"></span><span class="nt" style="font-size: 13px; font-weight: 600">[Name]</span></div>
</div>
</nav>

<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 26px 30px 28px; display: flex; flex-direction: column; gap: 16px">
<nav aria-label="Breadcrumb" class="crumb"><a href="D01-Dashboard.dc.html">Home</a><span aria-hidden="true">/</span><span aria-current="page" style="color: #231F1C; font-weight: 600">Notifications</span></nav>
<header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
<div style="flex: 1 1 240px; display: flex; flex-direction: column; gap: 4px"><span class="lbl">Notifications</span><h1 style="font-size: 28px; font-weight: 700; letter-spacing: -0.02em">Reminders &amp; alerts</h1></div>
<button type="button" class="btn" onClick="{{readAll}}">Mark all as read</button>
</header>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="5"><button type="button" class="chip" onClick="{{f.pick}}" aria-pressed="{{f.on}}" style="cursor: pointer; min-height: 36px; background: {{f.bg}}; color: {{f.fg}}; border-color: {{f.bd}}">{{f.label}}</button></sc-for>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start">
<section class="card" aria-label="Notifications" style="flex: 999 1 520px; min-width: 0; padding: 6px 18px">
<sc-for list="{{items}}" as="n" hint-placeholder-count="6">
<div class="row" style="background: {{n.bg}}; margin: 0 -18px; padding: 14px 18px">
<span style="width: 8px; height: 8px; border-radius: 50%; background: {{n.dot}}; flex: none"></span>
<span style="width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid #8A8682; display: flex; align-items: center; justify-content: center; flex: none"><span class="ic"></span></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 3px"><span style="font-weight: {{n.w}}">{{n.title}}</span><span style="font-size: 12px; color: #66615D">{{n.kind}} · {{n.when}}</span></span>
<a href="{{n.href}}" class="btn" onClick="{{n.read}}">{{n.action}}</a>
<button type="button" class="btn" aria-label="Dismiss" onClick="{{n.dismiss}}" style="width: 40px; padding: 0">×</button>
</div>
</sc-for>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}"><p style="padding: 40px 0; text-align: center; font-size: 14px; color: #66615D">You're all caught up.</p></sc-if>
</section>
<aside class="card" aria-label="Notification settings" style="flex: 1 1 280px; padding: 18px; display: flex; flex-direction: column; gap: 4px">
<h2 style="font-size: 16px; font-weight: 700; padding-bottom: 6px">Send me</h2>
<label class="row" style="cursor: pointer"><span style="flex: 1">Expiry reminders<br><span style="font-size: 12px; color: #66615D">2 days before</span></span><input type="checkbox" checked="checked" style="width: 20px; height: 20px"></label>
<label class="row" style="cursor: pointer"><span style="flex: 1">Low-stock alerts</span><input type="checkbox" checked="checked" style="width: 20px; height: 20px"></label>
<label class="row" style="cursor: pointer"><span style="flex: 1">Meal plan reminders<br><span style="font-size: 12px; color: #66615D">1 hr before each meal</span></span><input type="checkbox" checked="checked" style="width: 20px; height: 20px"></label>
<label class="row" style="cursor: pointer; border: 0"><span style="flex: 1">Budget alerts<br><span style="font-size: 12px; color: #66615D">at 80% and 100%</span></span><input type="checkbox" checked="checked" style="width: 20px; height: 20px"></label>
<span style="font-size: 12px; color: #66615D; padding-top: 6px">Quiet hours: 22:00–08:00</span>
</aside>
</div>

<div style="position: sticky; bottom: 24px; display: flex; justify-content: flex-end; pointer-events: none; margin-top: auto"><a href="D12-Camera.dc.html" class="fab" aria-label="Open AI camera"><span class="dot"><span></span></span>AI camera</a></div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { filter: 'All', read: {}, gone: {} }; }
  renderVals() {
    const s = this.state;
    const all = [
      { id: 'n1', kind: 'Expiry', title: '[Ingredient] expires tomorrow', when: '08:00', action: 'Find a recipe', href: 'D00-Kitchen.dc.html' },
      { id: 'n2', kind: 'Low stock', title: 'Only 1 [item] left', when: '07:30', action: 'Add to To buy', href: 'D06-Fridge.dc.html#list' },
      { id: 'n3', kind: 'Meal plan', title: 'Dinner tonight: [Recipe] at 19:00', when: 'Yesterday', action: 'Open plan', href: 'D02-Calendar.dc.html' },
      { id: 'n4', kind: 'Budget', title: 'Food budget at 80% for October', when: 'Yesterday', action: 'View budget', href: 'D07-Budget.dc.html' },
      { id: 'n5', kind: 'Expiry', title: '[Ingredient] and [Ingredient] expire in 2 days', when: 'Mon', action: 'Open fridge', href: 'D06-Fridge.dc.html' },
      { id: 'n6', kind: 'Meal plan', title: 'Did you eat [planned lunch]?', when: 'Mon', action: 'Confirm', href: 'D05-Journal.dc.html' }
    ];
    const live = all.filter((n) => !s.gone[n.id]);
    const shown = s.filter === 'All' ? live : live.filter((n) => n.kind === s.filter);
    const items = shown.map((n) => {
      const unread = !s.read[n.id] && ['n1', 'n2', 'n3', 'n4'].indexOf(n.id) >= 0;
      return Object.assign({}, n, { bg: unread ? '#F6F6F4' : 'transparent', dot: unread ? '#231F1C' : 'transparent', w: unread ? '600' : '400',
        read: () => { const r = Object.assign({}, s.read); r[n.id] = true; this.setState({ read: r }); },
        dismiss: () => { const g = Object.assign({}, s.gone); g[n.id] = true; this.setState({ gone: g }); } });
    });
    const unread = live.filter((n) => !s.read[n.id] && ['n1', 'n2', 'n3', 'n4'].indexOf(n.id) >= 0).length;
    const filters = ['All', 'Expiry', 'Low stock', 'Meal plan', 'Budget'].map((f) => ({ label: f, on: String(s.filter === f),
      bg: s.filter === f ? '#231F1C' : '#FFFFFF', fg: s.filter === f ? '#FFFFFF' : '#4A4542', bd: s.filter === f ? '#231F1C' : '#C9C9C6', pick: () => this.setState({ filter: f }) }));
    return { items, filters, unread: String(unread), empty: items.length === 0,
      readAll: () => { const r = {}; all.forEach((n) => { r[n.id] = true; }); this.setState({ read: r }); } };
  }
}
</script>
</body>
</html>
